<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>フィールド注意事項ポップオーバー 設定</title>
</head>
<body>
  <div class="ihp-config">
    <h1>フィールド注意事項ポップオーバー 設定</h1>
    <p class="ihp-description">
      「＋ フィールドを追加」で設定項目を追加し、フィールドを選択して注意事項を入力してください。
      追加・編集・詳細画面のフィールドラベル横に❔アイコンが表示されます。URLをそのまま入力するとリンクとして表示されます。
      特定の文字列だけをリンクにしたい場合は <code>[表示したい文字](URL)</code> の形式で入力してください（例: <code>[app04](https://example.com/k/04/)</code>）。
    </p>

    <div id="ihp-loading">読み込み中...</div>
    <div id="ihp-error" class="ihp-error" style="display:none;"></div>

    <div id="ihp-rows" class="ihp-rows" style="display:none;"></div>

    <button type="button" id="ihp-add-row-button" class="ihp-btn-add" style="display:none;">＋ フィールドを追加</button>

    <div class="ihp-buttons">
      <button type="button" id="ihp-save-button" class="ihp-btn-primary">保存</button>
      <button type="button" id="ihp-cancel-button" class="ihp-btn-secondary">キャンセル</button>
    </div>
  </div>

  <template id="ihp-row-template">
    <div class="ihp-row">
      <select class="ihp-field-select"></select>
      <textarea class="ihp-note-textarea" placeholder="例: 詳細は [app04](https://example.com/k/04/) を参照してください"></textarea>
      <button type="button" class="ihp-remove-row-button" aria-label="この設定を削除">－</button>
    </div>
  </template>
</body>
</html>
